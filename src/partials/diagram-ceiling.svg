  <text class="dg-sub" x="560" y="394" text-anchor="middle">≈ 1 km</text>
  <text class="dg-sub en" x="20" y="236">Road tunnel, long section</text>
  <text class="dg-sub zh" x="20" y="236">公路隧道纵剖面</text>
</svg>
